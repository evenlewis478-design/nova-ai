<script>

const cv=$('c'),stage=$('stage');

r.setPixelRatio(Math.min(devicePixelRatio,2));r.outputEncoding=THREE.sRGBEncoding;r.toneMapping=THREE.ACESFilmicToneMapping;r.toneMappingExposure=1.1;

  const c=liveCheck();return{gun:sel.mn,longAxis:G.ax,upAxis:G.up,size:G.sz.toArray().map(v=>+v.toFixed(3)),muzzleDirection:G.dir.toArray(),parts:parts.slice(0,30),materialCount:new Set(mats).size,hasBoltPart:!!G.bolt.length,hasMagPart:!!G.mag.length,animation:P,recipes:Object.keys(getRec()),clips:CLIPS.map(c=>c.name||''),attachments:Object.fromEntries(Object.entries(ATT).filter(([k,v])=>v&&v.type)),camo:camoK||'none',controls:BIND,editsAlreadyApplied:opsLog.flat().map(o=>o.op),currentShooterCheck:{verdict:c.verdict,problems:c.f.map(i=>i.t+': '+i.d),tips:c.w.map(i=>i.t+': '+i.d)}}}
const alog=$('alog');
function addMsg(r,t,list){const d=document.createElement('div');d.className='msg '+r;d.textContent=t;if(list&&list.length){const u=document.createElement('ul');list.forEach(x=>{const li=document.createElement('li');li.textContent=x;u.appendChild(li)});d.appendChild(u)}alog.appendChild(d);alog.scrollTop=alog.scrollHeight}
function setBusy(b,txt){busy=b;$('abusy').classList.toggle('hide',!b);if(txt)$('abt').textContent=txt;$('ain').disabled=b;$('asend').disabled=b;alog.scrollTop=alog.scrollHeight}
const greet=()=>addMsg('ai','Tell me what you want for this gun. I can fix problems, resize it, move the pivot, paint event skins, add scopes and charms, and tune the shooting, reload and aim animations. Then I run the shooter check on the new version.');
async function ask(text){
  text=text.trim();if(!text||busy||!G)return;addMsg('me',text);$('ain').value='';setBusy(true,'Making new feature…');
  try{let sm=null;try{sm=window.claude&&await window.claude.use('sample')}catch(e){}
    if(!sm){addMsg('ai','The AI runs only when this page is published as a Claude artifact with the sample capability allowed. Publish it, open the link, and allow access when asked. The skin buttons work here without it.');return}
    const prompt=modelBlock()+'\n\nRECIPE STEP: {\"op\":\"recipe\",\"name\":\"<a name from GUN CONTEXT recipes>\"} runs a saved sequence.'+(extraAI()?'\n\nDEVELOPER NOTES (follow these too):\n'+extraAI():'')+'\n\nGUN CONTEXT (json):\n'+JSON.stringify(describe())+'\n\nCONVERSATION SO FAR:\n'+aiHist.slice(-6).map(h=>h.r+': '+h.t).join('\n')+'\n\nUSER REQUEST:\n'+text;
    const r=await sm(prompt,smOpts(curModel())),t=r.text||'',j=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));
    aiHist.push({r:'user',t:text},{r:'you',t:j.reply||''});
    const ops=Array.isArray(j.ops)?j.ops:[];let res=[];if(ops.length){opsLog.push(ops);res=runOps(ops)}
    const fix=await selfFix(sm);addMsg('ai',j.reply||'Done.',res.concat(fix,[checkLine(liveCheck())]));
  }catch(x){console.error(x);addMsg('ai',x&&x.code==='rate_limited'?'Too many requests right now. Wait a moment and try again.':x&&x.code==='not_granted'?'Claude access was not allowed for this page, so the AI cannot run. You can allow it in the page permissions.':'Something went wrong making that change ('+((x&&x.message)||x)+'). Nothing was broken. Try asking a different way.')}
  finally{setBusy(false)}}
async function rebuild(txt){setBusy(true,txt);try{await showModel();for(const b of opsLog)runOps(b)}finally{setBusy(false)}}
$('asend').onclick=()=>ask($('ain').value);
$('ain').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();ask($('ain').value)}});
$('chips').innerHTML=['Fix everything the shooter check found','Make it a Halloween gun','Make it a Christmas gun','Add a scope and a silencer','Tune it as a fast SMG-style gun'].map(t=>'<button>'+t+'</button>').join('');
$('chips').querySelectorAll('button').forEach(b=>b.onclick=()=>ask(b.textContent));
$('skins').innerHTML='<span>Quick skins:</span>'+Object.keys(THEMES).map(k=>'<button data-k="'+k+'">'+k+'</button>').join('');
$('skins').querySelectorAll('button').forEach(b=>b.onclick=()=>{if(!G||busy)return;const o=[{op:'theme',name:b.dataset.k}];opsLog.push(o);addMsg('ai',runOps(o)[0]+'.',[checkLine(liveCheck())])});
$('aund').onclick=()=>{if(!opsLog.length||busy)return;opsLog.pop();rebuild('Undoing…').then(()=>addMsg('ai','Undid the last change.'))};
$('arst').onclick=()=>{if(busy||!G)return;opsLog=[];rebuild('Resetting…').then(()=>addMsg('ai','Back to the original gun.'))};
$('achk').onclick=()=>{if(!G)return;const c=liveCheck();addMsg('ai',checkLine(c),c.f.concat(c.w).map(i=>i.t+': '+i.d))};
function packORM(m){const a=m.aoMap,r=m.roughnessMap,t=m.metalnessMap;if(!r||!t||r===t)return;const S=1024,px=x=>{if(!x||!x.image)return null;const c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d');g.drawImage(x.image,0,0,S,S);return g.getImageData(0,0,S,S).data};
  const A=px(a),Rr=px(r),T=px(t),c=document.createElement('canvas');c.width=c.height=S;const g=c.getContext('2d'),d=g.createImageData(S,S);
  for(let i=0;i<S*S*4;i+=4){d.data[i]=A?A[i]:255;d.data[i+1]=Rr[i];d.data[i+2]=T[i];d.data[i+3]=255}g.putImageData(d,0,0);
  const tx=new THREE.CanvasTexture(c);tx.flipY=r.flipY;m.roughnessMap=m.metalnessMap=tx;if(A)m.aoMap=tx;m.needsUpdate=true}
function glb(){return new Promise((ok,no)=>{const w=console.warn;try{console.warn=()=>{};eachMesh(m=>[].concat(m.material).forEach(packORM));cur.position.set(0,0,0);cur.quaternion.identity();cur.updateMatrixWorld(true);new THREE.GLTFExporter().parse(cur,b=>{console.warn=w;ok(b)},{binary:true,maxTextureSize:2048,animations:CLIPS})}catch(x){console.warn=w;no(x)}})}
$('asave').onclick=async()=>{if(!G||busy)return;setBusy(true,'Saving…');try{const buf=await glb(),name=sel.mn.replace(/\.[a-z0-9]+$/i,'')+' (edited).glb',e={id:Date.now()+'-'+Math.random().toString(36).slice(2,6),name:'Edited: '+sel.mn,added:Date.now(),files:[new File([buf],name)],checks:{}};
  lib.push(e);const ok=await put(e);renderLib();setBusy(false);await pick(e.id,name);addMsg('ai','Saved as a new gun in your library'+(ok?'.':', but this browser would not keep it for next time.'))}catch(x){console.error(x);setBusy(false);addMsg('ai','Could not save: '+((x&&x.message)||x))}};
$('adl').onclick=async()=>{if(!G||busy)return;try{const d=window.claude&&await window.claude.use('downloads');if(!d){addMsg('ai','Downloading is not available here. Use Save as new gun to keep it in your library.');return}
  const buf=await glb();await d.save({filename:sel.mn.replace(/\.[a-z0-9]+$/i,'')+' (edited).glb',data:new Blob([buf])});addMsg('ai','Download sent.')}catch(x){addMsg('ai',x&&x.code==='declined'?'Download cancelled.':'Could not download ('+((x&&x.message)||x)+'). Use Save as new gun instead.')}};

// ---------- wiring ----------
$('f').onchange=ev=>{if(ev.target.files.length)addFiles(ev.target.files);ev.target.value=''};
$('tg').onclick=()=>$('side').classList.toggle('closed');
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
$('spin').onclick=()=>{ctl.autoRotate=!ctl.autoRotate;$('spin').classList.toggle('on',ctl.autoRotate)};
$('wire').onclick=()=>{wireOn=!wireOn;mats.forEach(m=>m.wireframe=wireOn);$('wire').classList.toggle('on',wireOn)};
addEventListener('dragover',ev=>{ev.preventDefault();$('empty').classList.add('hv')});
addEventListener('dragleave',()=>$('empty').classList.remove('hv'));
addEventListener('drop',ev=>{ev.preventDefault();$('empty').classList.remove('hv');if(ev.dataTransfer.files.length)addFiles(ev.dataTransfer.files)});
const mq=matchMedia('(max-width:700px)');$('side').classList.toggle('closed',mq.matches);mq.addEventListener('change',e=>$('side').classList.toggle('closed',e.matches));
try{refreshModelUI()}catch(err){console.error(err)}
(async()=>{db=await idb();
  if(db){try{const all=await new Promise(res=>{const q=db.transaction('pkgs').objectStore('pkgs').getAll();q.onsuccess=()=>res(q.result||[]);q.onerror=()=>res([])});
    lib=all.sort((a,b)=>a.added-b.added).map(x=>({id:x.id,name:x.name,added:x.added,checks:x.checks||{},files:x.files.map(f=>new File([f.b],f.n))}))}catch(x){}}
  [refreshModelUI,renderLib,updateEmpty,rs,migrateRules].forEach(f=>{try{f()}catch(err){console.error(err)}});if(db)kvGet('bg').then(b=>{if(b&&b.blob)applyBg(b)});
  if(lib.length){const e=lib[lib.length-1];await pick(e.id,nice(modelsOf(e)[0].name))}})();
</script></body></html>
